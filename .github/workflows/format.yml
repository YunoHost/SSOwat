name: Automatically reformat files

on:
  push:
    branches: [main, dev, bullseye, bookworm, trixie]

jobs:
  lua:
    name: Format Lua code and commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: -v .

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ":art: Format Lua code with Stylua"
